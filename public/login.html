<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCS Site QA – Sign in</title>
<style>
:root{--ground:#f3f2f1;--sheet:#fff;--ink:#141414;--ink-2:#585b5f;--line:#cfcdcb;--label:#e4e3e2;--red:#d10f0f}
@media (prefers-color-scheme:dark){:root{--ground:#111;--sheet:#1b1b1b;--ink:#ededec;--ink-2:#a7a9ac;--line:#3a3a3a;--label:#2a2a2a;--red:#ff5245}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{background:#141414;color:#fff;padding:12px 16px;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:14px}
header .logo{background:#fff;padding:4px 7px;line-height:0}header img{height:28px}
header b{display:block;font-size:17px}header span{font-size:12.5px;color:#bdbdbd}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
form{width:min(380px,100%);background:var(--sheet);border:1.5px solid var(--ink);border-top:6px solid var(--red)}
form h1{margin:0;padding:14px 16px 4px;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
form p{margin:0;padding:0 16px 12px;color:var(--ink-2);font-size:14px}
label{display:block;background:var(--label);padding:5px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2);border-top:1px solid var(--line)}
input{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px;font:inherit;font-weight:600;color:inherit;outline:none}
input:focus{background:var(--label)}
button{margin:14px 16px 16px;min-height:44px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);font:inherit;font-weight:700;cursor:pointer}
.err{color:var(--red);font-weight:700;padding:10px 16px 0}
</style>
</head>
<body>
<header><span class="logo"><img src="/logo.png" alt="FCS"></span><span><b>FCS Site QA</b><span>Belmont Desalination Plant – MFRO · FE 9096</span></span></header>
<main>
<form method="post" action="/login">
<h1>Sign in</h1>
<p>Enter the site password from your FCS QA coordinator.</p>
<!--ERR-->
<label for="pw">Site password</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Open the app</button>
</form>
</main>
</body>
</html>
