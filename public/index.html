<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/logo.png"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>FCS Site QA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: FCS form language — black band, grey label cells, red only for hold points, fails and the brand. Left rail on desktop, scrolling tab strip on phones, record drawer on the right. */
:root{
  --ground:#f3f2f1; --sheet:#ffffff; --ink:#141414; --ink-2:#585b5f; --ink-3:#8a8d91;
  --label:#e4e3e2; --line:#cfcdcb; --line-2:#e9e8e6; --band:#141414; --band-ink:#ffffff;
  --red:#d10f0f; --red-soft:#fbe4e2;
  --pass:#1d7a3e; --pass-soft:#e1f2e6; --warn:#9a6200; --warn-soft:#fbefd9;
  --info:#1d5ea8; --info-soft:#e2ecf8; --hold:#d10f0f; --witness:#9a6200; --review:#585b5f;
  --f-display:"Archivo","Arial Narrow",Arial,Helvetica,sans-serif;
  --f-body:"Archivo",Arial,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 18px 50px rgba(20,20,20,.18);
  --qr-bg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111111; --sheet:#1b1b1b; --ink:#ededec; --ink-2:#a7a9ac; --ink-3:#77797c;
  --label:#2a2a2a; --line:#3a3a3a; --line-2:#262626; --band:#000000; --band-ink:#ffffff;
  --red:#ff5245; --red-soft:#3a1714;
  --pass:#5cc37f; --pass-soft:#16301f; --warn:#e2a646; --warn-soft:#352812;
  --info:#73a9ec; --info-soft:#15263a; --hold:#ff5245; --witness:#e2a646; --review:#a7a9ac;
  --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#111111; --sheet:#1b1b1b; --ink:#ededec; --ink-2:#a7a9ac; --ink-3:#77797c;
  --label:#2a2a2a; --line:#3a3a3a; --line-2:#262626; --band:#000000; --band-ink:#ffffff;
  --red:#ff5245; --red-soft:#3a1714;
  --pass:#5cc37f; --pass-soft:#16301f; --warn:#e2a646; --warn-soft:#352812;
  --info:#73a9ec; --info-soft:#15263a; --hold:#ff5245; --witness:#e2a646; --review:#a7a9ac;
  --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variation-settings:"wdth" 100}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Band */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.band-in{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{background:#fff;padding:5px 8px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.proj{min-width:0;flex:1 1 220px}
.proj b{display:block;font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:700;font-size:18px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.proj span{font-size:12.5px;color:#bdbdbd}
.proj span{display:block}
.proj .pqa{font-size:11px;color:#a7a9ac;margin-top:1px}
.proj .pqa:empty{display:none}
.mode{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #555;padding:3px 8px;color:#cfcfcf;white-space:nowrap}
.mode.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#45c46d;margin-right:6px;vertical-align:1px}
.mode.local::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e2a646;margin-right:6px;vertical-align:1px}
.redline{height:4px;background:var(--red)}

/* Shell */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - 64px)}
.rail{border-right:1px solid var(--line);background:var(--sheet);padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.rail nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:2px}
.navb{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;font-weight:600;font-size:14.5px;color:var(--ink-2);border-left:3px solid transparent}
.navb:hover{color:var(--ink);background:var(--line-2)}
.navb[aria-current="page"]{color:var(--ink);border-left-color:var(--red);background:var(--line-2)}
.navb .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-weight:500}
.rail .sep{height:1px;background:var(--line);margin:10px 12px}
.tabs{display:none}
main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabs{display:flex;gap:2px;overflow-x:auto;background:var(--sheet);border-bottom:1px solid var(--line);
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .navb{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:12px 12px 9px}
  .tabs .navb[aria-current="page"]{border-bottom-color:var(--red);background:none}
  .tabs .navb .ct{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

/* Type */
h1.vt{font-family:var(--f-display);font-variation-settings:"wdth" 78;font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1;margin:0;letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
.vsub{color:var(--ink-2);margin:6px 0 0;max-width:65ch}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2.sec{font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger.armed{background:var(--red);color:var(--sheet)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn svg{width:16px;height:16px;flex-shrink:0}
.linkb{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* Title block */
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1.5px solid var(--ink);background:var(--sheet)}
.tb>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tb .k{background:var(--label);padding:4px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.tb .v{padding:7px 10px 9px;font-weight:600;overflow-wrap:anywhere}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 26px}
.tile{background:var(--sheet);border:1px solid var(--line);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--ink)}
.tile:hover{border-color:var(--ink)}
.tile.alert{border-top-color:var(--red)}
.tile .big{font-family:var(--f-display);font-variation-settings:"wdth" 70;font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tile .cap{font-weight:700}
.tile .sm{color:var(--ink-2);font-size:13px}

.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}

/* Area bars */
.bars{display:flex;flex-direction:column;gap:12px;background:var(--sheet);border:1px solid var(--line);padding:16px}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 54px;gap:12px;align-items:center}
.bar-row .an{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.bar{display:flex;height:16px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%}
.bar-row .ac{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.c-open{background:var(--line)} .c-prog{background:var(--warn)} .c-fcs{background:var(--info)} .c-closed{background:var(--pass)}
@media (max-width:520px){.bar-row{grid-template-columns:90px minmax(0,1fr) 44px}}

/* Attention + activity lists */
.alist{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line)}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-2);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.aitem:last-child{border-bottom:0}
.aitem:hover{background:var(--line-2)}
.aitem .t{font-weight:600}
.aitem .s{color:var(--ink-2);font-size:13px}
.flag{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 6px;border:1px solid currentColor;align-self:start;margin-top:2px;white-space:nowrap}
.flag.red{color:var(--red)} .flag.amb{color:var(--warn)} .flag.blu{color:var(--info)} .flag.grn{color:var(--pass)}
.empty{padding:22px 16px;color:var(--ink-2);background:var(--sheet);border:1px dashed var(--line)}
.empty b{color:var(--ink);display:block;margin-bottom:2px}

/* Register */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);padding:0 10px;min-height:40px}
.search svg{width:16px;height:16px;flex-shrink:0;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;padding:8px 0}
.search:focus-within{border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--sheet);padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip .mono{font-size:11.5px;opacity:.8}
.tablebox{overflow-x:auto;background:var(--sheet);border:1px solid var(--line)}
table.reg{width:100%;border-collapse:collapse;min-width:760px}
table.reg th{background:var(--label);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding:7px 12px;font-weight:700;white-space:nowrap;border-bottom:1.5px solid var(--ink)}
table.reg td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:hover td{background:var(--line-2)}
table.reg td.mono{white-space:nowrap}
table.reg td.no{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
td .sub{color:var(--ink-2);font-size:13px}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .pb{flex:1;height:6px;background:var(--line-2);min-width:50px}
.prog .pb i{display:block;height:100%;background:var(--ink)}
.prog .mono{font-size:12px;color:var(--ink-2)}
.ex{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);border:1px dashed var(--ink-3);padding:0 4px;margin-left:6px;vertical-align:1px}

/* Status pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 8px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;background:currentColor}
.st.open{background:var(--line-2);color:var(--ink-2)}
.st.prog{background:var(--warn-soft);color:var(--warn)}
.st.fcs{background:var(--info-soft);color:var(--info)}
.st.done{background:var(--pass-soft);color:var(--pass)}
.st.bad{background:var(--red-soft);color:var(--red)}

/* Hold / witness / review markers */
.hp{font-family:var(--f-mono);font-weight:600;font-size:12px;width:24px;height:24px;display:inline-grid;place-items:center;border:1.5px solid currentColor;flex-shrink:0}
.hp.H{color:var(--hold);background:var(--red-soft)}
.hp.W{color:var(--witness)}
.hp.R{color:var(--review)}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--ink-3);padding:10px 14px;margin-bottom:18px;background:var(--sheet);font-size:14px}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--ground);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--band);color:var(--band-ink);padding:14px 18px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.dh .dno{font-family:var(--f-mono);font-size:12.5px;color:#bdbdbd}
.dh h3{margin:2px 0 0;font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:700;font-size:21px;line-height:1.15;text-wrap:balance}
.dh .x{background:none;border:1px solid #555;color:#fff;width:36px;height:36px;display:grid;place-items:center;flex-shrink:0}
.dbody{flex:1;overflow-y:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:22px}
.dfoot{border-top:1px solid var(--line);background:var(--sheet);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dfoot .grow{flex:1}

/* Form grid in FCS label-cell style */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1.5px solid var(--ink);background:var(--sheet)}
.fg .f{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.fg .f.wide{grid-column:1/-1}
.fg label{background:var(--label);padding:4px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.fg label em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-3)}
.fg input,.fg select,.fg textarea{border:0;background:transparent;padding:9px 10px;width:100%;min-width:0;outline:none;font-weight:600}
.fg .unit{display:flex;align-items:center}
.fg .unit span{padding-right:10px;color:var(--ink-2);font-family:var(--f-mono);font-size:12.5px}
.fg input:focus,.fg select:focus,.fg textarea:focus{background:var(--line-2)}
.fg input[readonly]{color:var(--ink-2)}
.fg textarea{min-height:110px;resize:vertical;font-weight:400;line-height:1.5}
.fg select{appearance:auto}

/* Checklist */
.cl{background:var(--sheet);border:1.5px solid var(--ink)}
.cli{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:12px;border-bottom:1px solid var(--line)}
.cli:last-child{border-bottom:0}
.clsec{padding:9px 12px 7px;background:var(--line-2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.ino{font-size:12px;font-weight:600;color:var(--ink-2);min-width:30px;padding-top:2px}
.cli .q{font-weight:600;line-height:1.35}
.cli .q input{width:100%;border:1px solid var(--line);background:var(--ground);padding:6px 8px;font-weight:600}
.cli .ctl{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:var(--sheet);padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--pass);color:var(--sheet)}
.seg button[aria-pressed="true"].f{background:var(--red);color:var(--sheet)}
.seg button[aria-pressed="true"].n{background:var(--ink-2);color:var(--sheet)}
.cli .note{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--ground);padding:6px 8px;font-size:13.5px}
.cli .typ{border:1px solid var(--line);background:var(--ground);padding:5px}
.clhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.key span{display:inline-flex;gap:6px;align-items:center}
.key .hp{width:20px;height:20px;font-size:11px}

/* Sign-off */
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sbox{border:1.5px solid var(--ink);background:var(--sheet)}
.sbox .sh{background:var(--band);color:var(--band-ink);padding:6px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between}
.sbox .fg{border:0}
.callout{border-left:4px solid var(--red);background:var(--red-soft);padding:10px 12px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.callout.info{border-left-color:var(--info);background:var(--info-soft)}

/* Notes in heading + dot point style */
.notes h5{font-size:13px;margin:10px 0 4px;text-decoration:underline;text-underline-offset:3px;font-weight:700}
.notes ul{margin:0;padding-left:18px}
.notes p{margin:4px 0}
.hint{font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* Settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.wl{background:var(--sheet);border:1.5px solid var(--ink)}
.wl .row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;border-bottom:1px solid var(--line)}
.wl .row:last-child{border-bottom:0}
.wl .row input{border:0;border-right:1px solid var(--line);background:transparent;padding:9px 10px;min-width:0;font-weight:600;outline:none}
.wl .row input:focus{background:var(--line-2)}
.wl .row.h{background:var(--label)}
.wl .row.h div{padding:4px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.wl .rm{background:none;border:0;padding:0 12px;color:var(--ink-3)}
.wl .rm:hover{color:var(--red)}

/* Field: photos + files */
.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.fi:focus-visible+label{outline:2px solid var(--red);outline-offset:2px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{position:relative;background:var(--line-2);border:1px solid var(--line);aspect-ratio:1;max-width:100%;overflow:hidden;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

.drop{border:1.5px dashed var(--line);padding:16px;text-align:center;color:var(--ink-2);background:var(--sheet);margin-top:10px;font-size:14px}

/* Work-area groups on the ITR and EF weld lists */
.agrp{border:1px solid var(--line);background:var(--sheet);margin-bottom:10px}
.agrp>summary{list-style:none;cursor:pointer;background:var(--band);color:var(--band-ink);padding:8px 14px;min-height:46px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  "M1.T095":{"name": "Rotating equipment preservation", "long": "Rotating Equipment Preservation", "form": true, "fieldsTitle": "Reference data", "items": [["§Equipment Checks (Initial Delivery)"], ["Verify name plate details against data sheet", "", "", "2.1"], ["Confirm all equipment is stored in accordance with Vendor specifications (IOM)’s", "", "", "2.2"], ["Any open ports, nozzles or openings are sealed air/watertight.", "", "", "2.3"], ["Lubricate the product unit before the pump is stored.", "", "", "2.4"], ["§Equipment Checks – Short Term Storage (less than 3 months)"], ["Put the product into a dry storage where dirt or corrosion does not have an effect on it", "", "", "3.1"], ["Do not remove the protection plates on the product openings", "", "", "3.2"], ["Ensure the product bearings & drive unit parts have protection against unwanted materials", "", "", "3.3"], ["§Equipment Checks – Medium to Long Term Storage (more than 3 months)"], ["Drain the product from any liquid in it", "", "", "4.1"], ["Rotate the product shaft by hand at least once every two weeks to prevent bearing damage", "", "", "4.2"], ["With cast iron products equipped with gland packing, remove the gland packings from the stuffing box and apply rust preventives in the stuffing box", "", "", "4.3"], ["With oil lubrication, the bearing unit is emptied of oil before the delivery. Fill the bearing unit with oil, connect to a mist lubrication system, or coat the unit with a rust preventive film", "", "", "4.4"], ["Apply rust preventives to the unprotected parts, such as the shaft end, product flanges & coupling. If necessary, protect and shaft sealing with volatile corrosion inhibitors", "", "", "4.5"], ["Observe the storage instructions of any accessories (e.g. electric motors) included in the delivery", "", "", "4.6"], ["If the product unit is covered with plastic sheeting, the bottom should remain open to allow ventilation", "", "", "4.7"], ["§Installation Checks"], ["Ensure all temporary protective items (caps, flange covers) are removed before final piping connection", "", "", "5.1"], ["Re-lubricate bearings and check for proper rotation.", "", "", "5.2"], ["Ensure proper lubrication levels in lube oil systems (if applicable)", "", "", "5.3"], ["§Post - Installation Checks (If idle for period of time)"], ["Turn the product shaft at twice weekly intervals to prevent damage of bearing unit", "", "", "6.1"], ["Apply rust preventatives to exposed areas (shaft end / flanges etc)", "", "", "6.2"]], "fields": [{"k": "f_tag_number", "l": "Tag Number", "t": "text"}, {"k": "f_tag_description", "l": "Tag Description", "t": "text"}, {"k": "f_coupling_manufacturer", "l": "Coupling Manufacturer", "t": "text"}, {"k": "f_model_no", "l": "Model No", "t": "text"}, {"k": "f_serial_no", "l": "Serial No", "t": "text"}, {"k": "f_location_description", "l": "Location Description", "t": "text"}, {"k": "f_drawing_no", "l": "Drawing No.", "t": "text"}, {"k": "f_iom_manual_reference", "l": "IOM Manual Reference", "t": "text"}]},

function itrState(r){const it=r.items||[];
  if(r.imported&&!it.length){const s=r.client&&r.client.name?"Closed":(ITR_STATES.includes(r.status)?r.status:"In progress");return {s,done:0,total:0,fail:false,holds:0,issued:true}}const done=it.filter(i=>i.res).length;const fail=it.some(i=>i.res==="Fail");
  let s="Open";if(done>0||(r.fcs&&r.fcs.name))s="In progress";
  if(it.length&&done===it.length&&r.fcs&&r.fcs.name)s="FCS complete";
  if(s==="FCS complete"&&r.client&&r.client.name)s="Closed";
  const holds=it.filter(i=>i.type==="H"&&!i.res).length;
  return {s,done,total:it.length,fail,holds}}
const stClass=s=>({"Open":"open","In progress":"prog","Action in progress":"prog","Pending":"prog","Fixed – to verify":"prog","FCS complete":"fcs","Closed":"done","Accepted":"done","Accepted with comment":"fcs","Rejected":"bad"}[s]||"open");

async function zipRecords(kind){
  if(!downloads){toast("Downloads aren't available in this view.",true);return}
  if(typeof JSZip!=="function"){toast("The zip tool didn't load. Reload the page and try again.",true);return}
  if(S.zipping){toast("A zip is already being made.",true);return}
  const list=kind==="mivs"?filteredMivs():kind==="welds"?filteredWelds():filteredItrs();
  if(!list.length){toast("Nothing to download with the current filters.",true);return}
  const est=list.reduce((t,r)=>t+(r.files||[]).reduce((a,f)=>a+(f.st?0:(f.size||0)),0)+(r.photos||[]).length*600000,0);
  if(est>450*1048576){toast("That's about "+Math.round(est/1048576)+" MB. Filter to one area or type first (under 450 MB).",true);return}
  S.zipping=true;const zip=new JSZip();const missing=[];const links=[];let n=0;const total=list.reduce((t,r)=>t+(r.files||[]).length+(r.photos||[]).length,0);
  const tick=()=>zipBar("Making zip… "+n+" of "+total+" files");tick();
  try{
    for(const r of list){
      const folder=kind==="mivs"?safeName(r.no+" "+(r.supplier||"")):safeName((r.tpl||"")+" "+tname(r))+"/"+safeName(r.area||"No area")+"/"+safeName(r.no+" "+(r.title||""));
      const used=new Set();
      const add=async(aid,name,sub)=>{let nm=safeName(name);if(!/\.[a-z0-9]{2,4}$/i.test(nm))nm+=".pdf";let k=nm,i=2;while(used.has(sub+k)){k=nm.replace(/(\.[^.]+)$/," ("+(i++)+")$1")}used.add(sub+k);
        try{const res=await fetch(blobUrl(aid));if(!res.ok)throw 0;zip.file(folder+"/"+sub+k,await res.blob())}catch(e){missing.push(folder+"/"+sub+k)}n++;tick()};
      for(const f of (r.files||[])){if(f.st){links.push(folder+"/"+safeName(f.name)+"  ->  "+fUrl(f));n++;tick();continue}await add(f.aid,f.name,"")}
      for(const [i,p] of (r.photos||[]).entries())await add(p.aid,(i+1)+" "+(p.cap||"photo")+".jpg","photos/");
      zip.file(folder+"/record.txt",[r.no,r.title||r.desc||r.supplier||"",""].concat(String(r.notes||"").split("\n")).join("\r\n"));
    }
    zip.file("register.csv",registerCsv(kind,list));
    if(missing.length)zip.file("_could_not_download.txt",missing.join("\r\n"));
    if(links.length)zip.file("_signed_PDFs_open_online.txt",["These signed PDFs are kept in the app's records store. Open each link while signed in:",""].concat(links).join("\r\n"));
    zipBar("Compressing…");
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    zipBar("");
    const label=kind==="mivs"?"MIVs":kind==="welds"?"EF-welds":"ITRs";
    await downloads.save({filename:"FCS-"+label+"-"+au(today()).replace(/\//g,"-")+".zip",data:blob});
    toast(list.length+" records zipped"+(missing.length?" · "+missing.length+" files couldn't be added (listed in the zip)":""),!!missing.length);
  }catch(e){zipBar("");if(!(e&&e.code==="declined"))toast(e&&e.code==="too_large"?"The zip is too big. Filter to fewer records and try again.":"Couldn't make the zip. Check your connection and try again.",true)}
  finally{S.zipping=false;zipBar("")}}

const OKTYPES={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",csv:"text/csv",txt:"text/plain"};
function typeOf(f){const ext=String(f.name||"").split(".").pop().toLowerCase();if(f.type&&/^(image\/(jpeg|png|webp|gif)|application\/pdf|text\/plain|text\/csv)$/.test(f.type))return f.type;return OKTYPES[ext]||(/^image\//.test(f.type)?"image/jpeg":"")}
function compress(file){return new Promise(res=>{if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type||"")&&!/\.(jpe?g|png|heic)$/i.test(file.name||"")){res(file);return}
  const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const m=2200,s=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight));
    if(s===1&&file.size<1.8e6&&/jpeg|png|webp/.test(file.type)){URL.revokeObjectURL(u);res(file);return}
    const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>res(b||file),"image/jpeg",.84)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
function upErr(e,name){const c=e&&e.code;
  if(c==="too_large")return name+" is too big. Keep files under 20 MB.";
  if(c==="unsupported_type")return name+" can't be added. Use PDF, image or CSV files.";
  if(c==="not_granted"||c==="not_uploader")return "You don't have permission to add files.";
  if(c==="quota_or_state")return "File storage is full. Remove old files first.";
  return name+" didn't upload. Check your signal and try again."}
async function handleFiles(files,kind,extra){
  if(!assets){toast("File uploads need the online version of the app.",true);return}
  const d=S.draft;if(!d)return;const list=[...files];if(!list.length)return;
  const key=S.dcol==="packs"?"docs":"files";
  S.uploading+=list.length;drawDrawer();
  for(const f of list){
    try{
      let blob=f,type=typeOf(f);
      if(kind==="photo"||isImg({type})){blob=await compress(f);type=blob.type&&/^image\//.test(blob.type)?blob.type:type||"image/jpeg"}
      if(!type){toast(f.name+" can't be added. Use PDF, image or CSV files. Save drawings as PDF first.",true);continue}
      if(blob.size>20*1024*1024){toast(f.name+" is over 20 MB. Split or compress it first.",true);continue}
      let r;try{r=await assets.upload(blob,{type})}catch(e){if(e&&e.code==="store_unavailable"){await new Promise(z=>setTimeout(z,1200));r=await assets.upload(blob,{type})}else throw e}
      const at=new Date().toISOString();
      if(kind==="photo"){const it=extra.item!=null?(d.items||[])[extra.item]:null;
        (d.photos||(d.photos=[])).push({aid:r.id,cap:it?it.t:"",item:extra.item!=null?extra.item:null,at,type:r.contentType})}
      else (d[key]||(d[key]=[])).push({aid:r.id,name:f.name,cat:extra.cat||"Other",rev:extra.rev||"",type:r.contentType,size:r.sizeBytes,at,own:true});
      if(S.draft===d)markDirty();
    }catch(e){toast(upErr(e,f.name||"Photo"),true)}
    finally{S.uploading--}
  }
  if(S.draft===d){drawDrawer();flush().then(ok=>{if(ok)toast(kind==="photo"?(list.length>1?list.length+" photos saved":"Photo saved"):"Files saved")})}
}
function parseCSV(t){const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()))}

  const d=S.draft;if(!d)return;d.packing=(d.packing||[]).concat(rows.map(r=>({mark:(r[0]||"").trim(),desc:(r[1]||"").trim(),qty:(r[2]||"").trim(),unit:(r[3]||"").trim(),miv:(r[4]||"").trim()})));
  markDirty();drawDrawer();toast(rows.length+" packing list rows added")};
  fr.onerror=()=>toast("Couldn't read that file. Save it as CSV (comma separated) and try again.",true);fr.readAsText(file)}

function qrMatrix(text){if(typeof qrcode!=="function")return null;try{const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();return {n,dark:(r,c)=>q.isDark(r,c)}}catch(e){return null}}
function paintQR(g,m,x,y,cell){g.fillStyle="#ffffff";g.fillRect(x,y,(m.n+8)*cell,(m.n+8)*cell);g.fillStyle="#000000";
  for(let r=0;r<m.n;r++)for(let c=0;c<m.n;c++)if(m.dark(r,c))g.fillRect(x+(c+4)*cell,y+(r+4)*cell,cell,cell)}
function drawQRs(root){root.querySelectorAll("canvas.qrc").forEach(cv=>{const m=qrMatrix(cv.dataset.text);if(!m){cv.parentNode.innerHTML='<span class="hint" style="line-height:1.3;padding:6px;display:block">QR code didn\'t load. Reload the page.</span>';return}
  const cell=6;cv.width=cv.height=(m.n+8)*cell;paintQR(cv.getContext("2d"),m,0,0,cell)})}
function fitText(g,text,weight,size,maxW,fam){let s=size;do{g.font=weight+" "+s+"px "+fam;if(g.measureText(text).width<=maxW)break;s-=2}while(s>14);return s}

  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);
  g.fillStyle="#141414";g.fillRect(40,40,W-80,H-80);

  g.fillStyle="#141414";fitText(g,String(p.name).toUpperCase(),"800",120,W-200,F);g.fillText(String(p.name).toUpperCase(),W/2,470);
  g.fillStyle="#585b5f";fitText(g,st.project,"600",36,W-220,F);g.fillText(st.project,W/2,548);
  const N=m.n+8,cell=Math.floor(800/N),qs=cell*N,qx=Math.round((W-qs)/2),qy=600;
  g.strokeStyle="#141414";g.lineWidth=6;g.strokeRect(qx-3,qy-3,qs+6,qs+6);paintQR(g,m,qx,qy,cell);
  const ly=qy+qs+58;g.fillStyle="#141414";fitText(g,"Drawings · Model shots · Bolt tension · Packing lists","700",36,W-200,F);g.fillText("Drawings · Model shots · Bolt tension · Packing lists",W/2,ly);
  g.fillStyle="#585b5f";fitText(g,url,"500",24,W-200,M);g.fillText(url,W/2,ly+52);
  g.fillStyle="#d10f0f";g.fillRect(56,H-212,W-112,8);
  g.fillStyle="#141414";fitText(g,"Always work to the latest revision. Check with QA if unsure.","700",30,W-200,F);g.fillText("Always work to the latest revision. Check with QA if unsure.",W/2,H-160);
  g.fillStyle="#585b5f";const ft=[st.contractor,st.client?"Client: "+st.client:""].filter(Boolean).join("   ·   ");fitText(g,ft,"600",26,W-200,F);g.fillText(ft,W/2,H-108);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  try{await downloads.save({filename:"FCS-job-pack-QR-"+p.slug+".png",data:blob})}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the QR sign.",true)}}
async function qrOnly(p){const m=qrMatrix(packLink(p));if(!m||!downloads)return;const cell=16;const cv=document.createElement("canvas");cv.width=cv.height=(m.n+8)*cell;paintQR(cv.getContext("2d"),m,0,0,cell);

  else if(which==="mivs"){name="miv-register";head=["MIV no.","Date","Supplier","Docket","PO","Items","Qty","Certs","Result","S1.T016 ITR","Received by","Notes"];

  const card=k=>{const t=TPL[k];const n=t.items.filter(i=>String(i[0]).charAt(0)!=="§").length;const ns=t.items.filter(i=>String(i[0]).charAt(0)==="§").length;const hs=t.items.filter(i=>i[1]==="H").length;const used=S.itrs.filter(r=>r.tpl===k).length;
    return '<button class="aitem" data-act="pick" data-v="'+k+'" data-q="'+esc((k+" "+t.long+" "+t.name).toLowerCase())+'"><span class="flag">'+k+'</span><span><span class="t">'+esc(t.long)+'</span><br><span class="s">'+(n?n+" check"+(n===1?"":"s")+(ns>1?" in "+ns+" sections":"")+(hs?" · "+hs+" hold point"+(hs===1?"":"s"):""):"Write your own checks")+(t.fields.length?" · "+t.fields.length+" data fields":"")+(t.table?" · "+esc(t.table.title.toLowerCase()):"")+(used?" · "+used+" on file":"")+'</span></span></button>'};
  const K=Object.keys(TPL);const F=K.filter(k=>!TPL[k].quick).sort();const Q=K.filter(k=>TPL[k].quick);
  dr.innerHTML='<div class="dh"><div><div class="dno">New ITR</div><h3>Pick an ITR template</h3></div><button class="x" data-act="pickclose" aria-label="Close">'+icon("x",18)+'</button></div><div class="dbody"><div class="fg"><div class="f wide"><label for="pickq">Find a form</label><input id="pickq" type="search" placeholder="Form no. or name, e.g. T093 or flange" autocomplete="off"></div></div>'+
  '<div><h2 class="sec">Project ITR forms <span class="mono" style="font-weight:500;color:var(--ink-2);letter-spacing:0">'+F.length+'</span></h2><div class="alist" id="pickf">'+F.map(card).join("")+'</div></div>'+
  '<div><h2 class="sec">Quick checks</h2><div class="alist" id="pickqk">'+Q.map(card).join("")+'</div></div><p class="hint" id="picknone" hidden>No form matches. Try the form number, e.g. T075.</p></div>';
  const qi=dr.querySelector("#pickq");qi.addEventListener("input",()=>{const v=qi.value.trim().toLowerCase();let any=0;dr.querySelectorAll(".aitem[data-q]").forEach(b=>{const ok=!v||b.dataset.q.includes(v);b.hidden=!ok;if(ok)any++});dr.querySelector("#picknone").hidden=!!any});
  dr.querySelector(".x").focus()}
function closePicker(){if(!S.draft&&!$("#drawer").hidden){$("#drawer").hidden=true;$("#scrim").hidden=true}}

/* ---------- routing + boot ---------- */
const VIEWS=["dash","attn","itrs","welds","pressure","ptpid","packs","drawings","mivs","ncrs","defects","library"];
function hashView(){const h=String(location.hash||"");const m=h.match(/^#pack-([a-z0-9-]+)$/);if(m){S.view="pack";S.packSlug=m[1];return true}
  const v=h.replace(/^#/,"");if(VIEWS.includes(v)){S.view=v;return true}return false}
function route(){if(hashView()){if(S.draft)closeDrawer();render();window.scrollTo(0,0)}}
window.addEventListener("hashchange",route);
async function boot(){
  hashView();
  render();
  if(typeof qrcode!=="function"){const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";sc.onload=()=>{render();if(S.draft)drawDrawer()};document.head.appendChild(sc)}
  const C=window.claude;
  const [dbN,userN,dlN,asN]=await Promise.all(["db","user","downloads","assets"].map(n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null)));
  downloads=dlN;assets=asN;
  if(userN){try{const w=await userN.can("data.write");if(w===false)S.canWrite=false}catch(e){}
    try{S.canEdit=!!(await userN.canEdit())}catch(e){S.canEdit=false}}
  else if(dbN)S.canEdit=false;
  if(dbN){db=dbN;S.mode="live";const seen={};let got=0;const need=COLS.length+1;
    const first=k=>{if(!seen[k]){seen[k]=1;got++;if(got>=need)S.loaded=true}render()};
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));first(c)},err=>{if(err&&err.code==="revoked")S.canWrite=false;first(c)}));
    db.doc("settings/project").onSnapshot(s=>{S.settings=s.exists?s.data():null;first("s")},()=>first("s"));
  }else{S.mode="local";localLoad();S.loaded=true;render()}
}
boot();
})();
</script>
